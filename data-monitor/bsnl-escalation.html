
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSNL Contact Management</title>

    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../css/select2.min.css">
    <link rel="stylesheet" href="../css/select2-bootstrap-5-theme.min.css">
    <link rel="stylesheet" href="../css/flatpickr.min.css">
    <link rel="stylesheet" href="../css/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/all-in-one.css">
<style>
        /* minimal style for the dynamic status label */
        .status-label-box {
          
            border-left: 4px solid #0f3b5f;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .status-label-box .status-text {
            flex: 1;
            color: var(--primary);
            word-break: break-word;
        }
        .copy-status-btn {
            background: #e2e9f0;
            border: none;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.85rem;
            color: #0f3b5f;
            transition: 0.2s;
            white-space: nowrap;
        }
        .copy-status-btn:hover {
            background: #cbd8e5;
        }
        .app-card { padding-bottom: 1.5rem; }
        .filter-bar { flex-wrap: wrap; }
        .badge-pending { background: #f0b400; color: #222; }
        .badge-down { background: #dc3545; color: white; }
        .badge-up { background: #198754; color: white; }
    </style>
</head>

<body>

<div class="page-header">
    <div class="page-header-left">
        <i class="bi bi-hdd-stack-fill"></i>
        <div>
            <h1>BSNL Escalation Details</h1>
            <p>JTO &amp; AGM Contact Directory</p>
        </div>
    </div>
</div>


<main class="app-card">

  <div class="tab-header">
    <button class="tab-btn active" id="tabAddBtn">
      <i class="bi bi-person-plus"></i> Add Contact
    </button>
    <button class="tab-btn" id="tabListBtn">
      <i class="bi bi-table"></i> Manage Contacts
    </button>
  </div>

  <!-- ADD / EDIT FORM -->
  <section id="addPane" class="tab-pane active-pane">

    <h4 class="mb-3">
      <i class="bi bi-person-plus"></i> Add New BSNL Contact
    </h4>

    <div class="info-banner">
      <i class="bi bi-info-circle-fill"></i>
      Enter the BA and JTO/AGM details. Multiple records can be added for the same BA.
    </div>

    <form id="contactForm">
      <input type="hidden" id="rowNumber">

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">BA *</label>
          <input class="form-control" id="ba" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">JTO Name</label>
          <input class="form-control" id="jtoName">
        </div>

        <div class="col-md-6">
          <label class="form-label">JTO Phone</label>
          <input class="form-control" id="jtoPhone" type="tel">
        </div>

        <div class="col-md-6">
          <label class="form-label">JTO Email</label>
          <input class="form-control" id="jtoEmail" type="email">
        </div>

        <div class="col-md-6">
          <label class="form-label">AGM Name</label>
          <input class="form-control" id="agmName">
        </div>

        <div class="col-md-6">
          <label class="form-label">AGM Phone</label>
          <input class="form-control" id="agmPhone" type="tel">
        </div>

        <div class="col-md-6">
          <label class="form-label">AGM Email</label>
          <input class="form-control" id="agmEmail" type="email">
        </div>

        <div class="col-12 mt-4">
          <button class="btn btn-primary-custom" id="saveBtn" type="submit">
            <i class="bi bi-save"></i> Save Contact
          </button>

          <button class="btn btn-outline-custom ms-2" type="button" id="clearBtn">
            <i class="bi bi-eraser"></i> Clear
          </button>

          <button class="btn btn-outline-secondary ms-2 d-none" type="button" id="cancelEditBtn">
            Cancel Edit
          </button>
        </div>

      </div>
    </form>
  </section>

  <!-- CONTACT LIST -->
  <section id="listPane" class="tab-pane">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h5 class="mb-0">
        <i class="bi bi-people"></i> BSNL Contact Records
      </h5>

      <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
        <i class="bi bi-arrow-repeat"></i> Refresh
      </button>
    </div>

    <div class="filter-bar">
      <label for="searchBox">
        <i class="bi bi-funnel-fill"></i> Search:
      </label>

      <input id="searchBox" class="form-control" style="max-width:340px"
        placeholder="Search BA, JTO, AGM, phone or email">

      <span class="small text-muted ms-auto" id="recordCount">0 records</span>
    </div>

    <div id="loadingState">
      <span class="spinner-border spinner-border-sm me-2"></span>
      Loading contact records...
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0">
        <thead>
          <tr>
            <th>BA</th>
            <th>JTO Name</th>
            <th>JTO Phone</th>
            <th>JTO Email</th>
            <th>AGM Name</th>
            <th>AGM Phone</th>
            <th>AGM Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactsBody"></tbody>
      </table>
    </div>

   
  </section>
</main>

<script src="../js/jquery.min.js"></script>
<script src="../js/bootstrap.bundle.min.js"></script>
<script src="../js/jquery.dataTables.min.js"></script>
<script src="../js/dataTables.bootstrap5.min.js"></script>
<script src="../js/select2.min.js"></script>
<script src="../js/flatpickr.min.js"></script>
<script src="../js/sweetalert2.all.min.js"></script>

<script>
/* =============== CONFIGURATION =============== */

const API_URL = "https://script.google.com/macros/s/AKfycbyV7mkzAWb9vfM6itgaoK0blTZ7cyRoqLeY6_H8eJY5jn3RPmi3-KXnG8UqUhDEwOjW/exec";
const API_TOKEN = "Treasury_BSNL_2026@Secure#8271";

/* ============================================= */

let contacts = [];

const $ = id => document.getElementById(id);

const fields = [
  "ba",
  "jtoName",
  "jtoPhone",
  "jtoEmail",
  "agmName",
  "agmPhone",
  "agmEmail"
];

/*
 * JSONP API request.
 * This allows the static HTML to communicate with Apps Script
 * without a browser CORS preflight request.
 */
function callApi(action, data = {}) {

  return new Promise((resolve, reject) => {

    if (!API_URL || API_URL.includes("PASTE_YOUR")) {
      reject(new Error("Please configure the Apps Script Web App URL."));
      return;
    }

    const callback =
      "bsnlJsonp_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const params = new URLSearchParams({
      action,
      token: API_TOKEN,
      callback,
      ...data
    });

    const script = document.createElement("script");

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Request timed out. Please check the Apps Script deployment."));
    }, 25000);

    function cleanup() {
      clearTimeout(timer);
      delete window[callback];
      script.remove();
    }

    window[callback] = result => {
      cleanup();

      if (result && result.ok) {
        resolve(result);
      } else {
        reject(new Error(result?.message || "Request failed."));
      }
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("Unable to reach the Apps Script API."));
    };

    script.src =
      API_URL +
      (API_URL.includes("?") ? "&" : "?") +
      params.toString();

    document.body.appendChild(script);
  });
}

function showError(error) {
  Swal.fire({
    icon: "error",
    title: "Operation failed",
    text: error.message || String(error)
  });
}

function switchTab(which) {

  $("addPane").classList.toggle("active-pane", which === "add");
  $("listPane").classList.toggle("active-pane", which === "list");

  $("tabAddBtn").classList.toggle("active", which === "add");
  $("tabListBtn").classList.toggle("active", which === "list");

  if (which === "list") {
    loadContacts();
  }
}

function getFormData() {

  const data = {};

  fields.forEach(key => {
    data[key] = $(key).value.trim();
  });

  return data;
}

function clearForm() {

  $("contactForm").reset();
  $("rowNumber").value = "";

  $("saveBtn").innerHTML =
    '<i class="bi bi-save"></i> Save Contact';

  $("cancelEditBtn").classList.add("d-none");
}

function escapeHtml(value) {

  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function emailCell(value) {

  const email = String(value || "");

  if (!email) return "";

  return `<a href="mailto:${escapeHtml(email)}">${escapeHtml(email)}</a>`;
}

function renderContacts() {

  const query = $("searchBox").value.trim().toLowerCase();

  const filtered = contacts.filter(item => {

    return [
      item.ba,
      item.jtoName,
      item.jtoPhone,
      item.jtoEmail,
      item.agmName,
      item.agmPhone,
      item.agmEmail
    ].some(value =>
      String(value || "").toLowerCase().includes(query)
    );

  });

  $("recordCount").textContent =
    filtered.length + " of " + contacts.length + " records";

  $("contactsBody").innerHTML = filtered.map(item => {

    const row = Number(item.rowNumber);

    return `
      <tr>
        <td><strong>${escapeHtml(item.ba)}</strong></td>
        <td>${escapeHtml(item.jtoName)}</td>
        <td>${escapeHtml(item.jtoPhone)}</td>
        <td>${emailCell(item.jtoEmail)}</td>
        <td>${escapeHtml(item.agmName)}</td>
        <td>${escapeHtml(item.agmPhone)}</td>
        <td>${emailCell(item.agmEmail)}</td>

        <td class="text-nowrap">
          <button class="action-icons" style="border: none !important;" title="Edit"
            onclick="startEdit(${row})">
            <i class="bi bi-pencil-square"></i>
          </button>

          <button class="action-icons" style="border: none !important;" title="Delete"
            onclick="deleteContact(${row})">
            <i class="bi bi-trash3"></i>
          </button>
        </td>
      </tr>
    `;

  }).join("");

  if (!filtered.length) {
    $("contactsBody").innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-muted py-4">
          No matching contacts found.
        </td>
      </tr>
    `;
  }
}

async function loadContacts() {

  $("loadingState").style.display = "block";
  $("contactsBody").innerHTML = "";

  try {

    const response = await callApi("list");

    contacts = response.records || [];

    renderContacts();

  } catch (error) {

    showError(error);

  } finally {

    $("loadingState").style.display = "none";

  }
}

function startEdit(rowNumber) {

  const item = contacts.find(
    x => Number(x.rowNumber) === Number(rowNumber)
  );

  if (!item) return;

  $("rowNumber").value = item.rowNumber;

  fields.forEach(key => {
    $(key).value = item[key] || "";
  });

  $("saveBtn").innerHTML =
    '<i class="bi bi-check2-circle"></i> Update Contact';

  $("cancelEditBtn").classList.remove("d-none");

  switchTab("add");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

async function deleteContact(rowNumber) {

  const answer = await Swal.fire({
    icon: "warning",
    title: "Delete this contact?",
    text: "This will permanently delete the selected Google Sheet row.",
    showCancelButton: true,
    confirmButtonText: "Delete",
    confirmButtonColor: "#bd3543"
  });

  if (!answer.isConfirmed) return;

  try {

    await callApi("delete", {
      rowNumber: String(rowNumber)
    });

    await loadContacts();

    Swal.fire({
      icon: "success",
      title: "Contact deleted",
      timer: 1300,
      showConfirmButton: false
    });

  } catch (error) {

    showError(error);

  }
}

/* EVENT HANDLERS */

$("tabAddBtn").addEventListener("click", () => {
  switchTab("add");
});

$("tabListBtn").addEventListener("click", () => {
  switchTab("list");
});

$("refreshBtn").addEventListener("click", loadContacts);

$("searchBox").addEventListener("input", renderContacts);

$("clearBtn").addEventListener("click", clearForm);

$("cancelEditBtn").addEventListener("click", clearForm);

$("contactForm").addEventListener("submit", async event => {

  event.preventDefault();

  const data = getFormData();
  const rowNumber = $("rowNumber").value;

  if (!data.ba) {
    Swal.fire("BA required", "Please enter the BA name.", "warning");
    return;
  }

  $("saveBtn").disabled = true;

  try {

    await callApi(
      rowNumber ? "update" : "add",
      {
        ...data,
        rowNumber
      }
    );

    clearForm();

    await Swal.fire({
      icon: "success",
      title: rowNumber ? "Contact updated" : "Contact saved",
      timer: 1400,
      showConfirmButton: false
    });

    switchTab("list");

  } catch (error) {

    showError(error);

  } finally {

    $("saveBtn").disabled = false;

  }

});

/* INITIAL LOAD */
loadContacts();

</script>
</body>
</html>
