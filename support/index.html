<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Help and documentation portal">
  <title>Help Centre</title>

  <!-- Optional DOCX preview library. PDF files use the browser's built-in viewer. -->
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js"></script>

  <style>
    :root {
      --brand: #1769aa;
      --brand-dark: #10558e;
      --brand-soft: #e1effc;
      --text: #17191c;
      --muted: #62676d;
      --border: #e2e5e8;
      --surface: #ffffff;
      --page: #f8f9fb;
      --sidebar-width: 280px;
      --toc-width: 270px;
      --header-height: 66px;
      --content-max: 1050px;
      --shadow: 0 8px 28px rgba(0,0,0,.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      height: var(--header-height);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5.5%;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: var(--brand);
      text-decoration: none;
      font-weight: 800;
      font-size: 21px;
      letter-spacing: -.5px;
    }
    .brand-mark {
      width: 42px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 2px solid var(--brand);
      color: var(--brand);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -2px;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.2;
    }
    .top-actions { display: flex; align-items: center; gap: 24px; }
    .top-actions a {
      color: #25282b;
      text-decoration: none;
      font-size: 14px;
    }
    .top-actions a:hover { color: var(--brand); }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--toc-width);
      min-height: calc(100vh - var(--header-height));
    }

    .left-sidebar {
      border-right: 1px solid var(--border);
      background: #fff;
      padding: 26px 15px 40px;
      min-width: 0;
    }
    .sidebar-heading {
      margin: 0 10px 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .search-wrap {
      position: relative;
      margin: 0 8px 22px;
    }
    .search-wrap input {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      background: #fafafa;
      color: var(--text);
    }
    .search-wrap input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(23,105,170,.1);
    }
    .search-icon {
      position: absolute;
      right: 12px;
      top: 9px;
      color: var(--muted);
      pointer-events: none;
    }
    .nav-list, .subnav, .topic-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .main-nav-item { margin: 2px 0; }
    .main-nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 0;
      background: transparent;
      color: #555b61;
      text-align: left;
      padding: 9px 10px;
      border-radius: 3px;
      font-size: 14px;
    }
    .main-nav-button:hover, .subnav-button:hover {
      background: #f3f6f9;
      color: var(--brand-dark);
    }
    .main-nav-button[aria-expanded="true"] {
      color: #17191c;
      font-weight: 700;
    }
    .chevron {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform .15s ease;
      margin: -4px 4px 0 0;
    }
    .main-nav-button[aria-expanded="true"] .chevron {
      transform: rotate(225deg);
      margin-top: 4px;
    }
    .subnav { padding: 1px 0 7px 12px; }
    .subnav-group { margin: 2px 0 5px; }
    .subnav-label {
      padding: 6px 10px 3px;
      color: #858b91;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .topic-button, .subnav-button {
      width: 100%;
      display: block;
      border: 0;
      background: transparent;
      color: #555b61;
      text-align: left;
      padding: 8px 10px;
      border-radius: 2px;
      font-size: 13.5px;
      line-height: 1.45;
    }
    .topic-button { padding-left: 13px; }
    .topic-button.active {
      color: #111820;
      background: var(--brand-soft);
      font-weight: 700;
    }
    .topic-button:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    .empty-search {
      padding: 12px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .main-area {
      min-width: 0;
      padding: 36px clamp(24px, 5vw, 78px) 60px;
      background: #fff;
    }
    .main-inner {
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      min-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
    }
    .content-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }
    .breadcrumbs {
      min-width: 0;
      color: #737980;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .breadcrumbs span { margin: 0 7px; color: #a0a5aa; }
    .breadcrumbs strong { color: #202428; }
    .article-search {
      width: min(240px, 38%);
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fafafa;
      color: var(--text);
      font-size: 13px;
    }
    .article-title {
      margin: 0 0 12px;
      color: #080a0c;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.16;
      letter-spacing: -.045em;
      font-weight: 750;
    }
    .article-meta {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 13px;
    }
    .article-content {
      min-height: 220px;
      color: #24282c;
      font-size: 16px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }
    .article-content h1 {
      margin: 1.2em 0 .5em;
      font-size: 1.9em;
      line-height: 1.2;
    }
    .article-content h2 {
      margin: 1.6em 0 .55em;
      font-size: 1.45em;
      line-height: 1.3;
    }
    .article-content h3 {
      margin: 1.35em 0 .5em;
      font-size: 1.18em;
    }
    .article-content p { margin: 0 0 1.1em; }
    .article-content img { max-width: 100%; height: auto; }
    .article-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 14px;
    }
    .article-content th, .article-content td {
      border: 1px solid var(--border);
      padding: 9px 11px;
      text-align: left;
      vertical-align: top;
    }
    .article-content th { background: #f4f6f8; }
    .article-content pre {
      overflow: auto;
      padding: 15px;
      background: #f4f6f8;
      border-radius: 5px;
    }
    .article-content code {
      font-family: Consolas, Monaco, monospace;
      font-size: .9em;
    }
    .article-content blockquote {
      margin: 18px 0;
      padding: 10px 18px;
      border-left: 3px solid var(--brand);
      background: #f6f8fa;
      color: #50575e;
    }
    .article-content a { color: var(--brand-dark); }
    .article-content hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }

    .docx-container {
      width: 100%;
      overflow-x: auto;
      background: #f1f3f5;
      padding: 18px;
      border-radius: 5px;
    }
    .docx-container .docx-wrapper { background: transparent; padding: 0; }
    .docx-container section.docx {
      margin: 0 auto 18px;
      box-shadow: 0 1px 7px rgba(0,0,0,.12);
    }
    .pdf-frame {
      display: block;
      width: 100%;
      min-height: 78vh;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: auto;
      padding-top: 60px;
    }
    .nav-card {
      min-width: 0;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .nav-card.next { text-align: right; }
    .nav-caption {
      display: block;
      margin-bottom: 8px;
      color: #858b91;
      font-size: 12px;
      text-transform: uppercase;
    }
    .prev-next {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      border: 0;
      background: transparent;
      color: #111820;
      padding: 0;
      font-size: 16px;
      font-weight: 700;
      text-align: inherit;
    }
    .prev-next:hover { color: var(--brand); }
    .prev-next span { overflow-wrap: anywhere; }
    .prev-next:disabled { visibility: hidden; }

    .right-sidebar {
      border-left: 1px solid var(--border);
      padding: 38px 25px 40px;
      background: #fff;
      min-width: 0;
    }
    .toc-sticky { position: sticky; top: calc(var(--header-height) + 28px); }
    .toc-title {
      margin: 0 0 18px;
      color: #111;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      border-left: 1px solid transparent;
    }
    .toc-list li { margin: 0 0 9px; }
    .toc-list a {
      display: block;
      color: #59616a;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.45;
      padding-left: 0;
    }
    .toc-list a:hover, .toc-list a.current {
      color: var(--brand-dark);
    }
    .toc-list li.level-2 a { padding-left: 12px; }
    .toc-list a.current {
      border-left: 2px solid #75b8ef;
      padding-left: 10px;
      font-weight: 700;
    }
    .toc-list li.level-2 a.current { padding-left: 20px; }
    .toc-empty { color: #92989e; font-size: 13px; }

    .status {
      padding: 35px 0;
      color: var(--muted);
      text-align: center;
    }
    .status.error { color: #b42318; }
    .mobile-tools {
      display: none;
      gap: 8px;
      margin-bottom: 15px;
    }
    .mobile-tools button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      padding: 7px 11px;
      color: #30363b;
      font-size: 13px;
    }
    .scrim { display: none; }

    @media (max-width: 1100px) {
      :root { --sidebar-width: 245px; --toc-width: 225px; }
      .main-area { padding-left: 35px; padding-right: 35px; }
      .right-sidebar { padding-left: 18px; padding-right: 18px; }
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .left-sidebar, .right-sidebar {
        position: fixed;
        z-index: 70;
        top: var(--header-height);
        bottom: 0;
        width: min(86vw, 320px);
        overflow-y: auto;
        background: #fff;
        box-shadow: var(--shadow);
        transition: transform .22s ease;
      }
      .left-sidebar {
        left: 0;
        transform: translateX(-105%);
      }
      .right-sidebar {
        right: 0;
        transform: translateX(105%);
      }
      body.show-left .left-sidebar { transform: translateX(0); }
      body.show-toc .right-sidebar { transform: translateX(0); }
      .scrim {
        position: fixed;
        inset: var(--header-height) 0 0;
        z-index: 60;
        background: rgba(0,0,0,.32);
      }
      body.show-left .scrim, body.show-toc .scrim { display: block; }
      .main-area { padding: 25px 22px 45px; }
      .mobile-tools { display: flex; }
      .content-toolbar { margin-bottom: 25px; }
      .topbar { padding: 0 18px; }
      .top-actions { gap: 13px; }
      .top-actions a:not(.get-started) { display: none; }
      .right-sidebar { border-left: 0; }
    }
    @media (max-width: 520px) {
      :root { --header-height: 58px; }
      .brand { font-size: 18px; }
      .brand-mark { width: 34px; height: 32px; font-size: 16px; }
      .top-actions .get-started { padding: 7px 10px; font-size: 12px; }
      .main-area { padding: 18px 16px 35px; }
      .content-toolbar { align-items: flex-start; flex-direction: column; gap: 12px; }
      .article-search { width: 100%; }
      .article-title { font-size: 29px; }
      .article-content { font-size: 15px; }
      .bottom-nav { gap: 12px; padding-top: 42px; }
      .prev-next { font-size: 14px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="Help Centre home">
      <span class="brand-mark">HC</span>
      <span>HELP CENTRE<small>Knowledge & Support Portal</small></span>
    </a>
    <nav class="top-actions" aria-label="Top navigation">
      <a href="#" id="resourcesLink">Resources</a>
      <a href="mailto:support@example.com" id="contactLink">Contact us</a>
      <a class="get-started" href="#" id="getStartedLink"
         style="background:#e52329;color:white;padding:9px 18px;font-weight:700">Get started</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="left-sidebar" id="leftSidebar" aria-label="Help topics">
      <div class="sidebar-heading">Help topics</div>
      <div class="search-wrap">
        <input id="topicSearch" type="search" placeholder="Search help topics..." autocomplete="off">
        <span class="search-icon" aria-hidden="true">⌕</span>
      </div>
      <nav id="sidebarNavigation">
        <div class="status">Loading help topics...</div>
      </nav>
    </aside>

    <main class="main-area">
      <div class="main-inner">
        <div class="mobile-tools">
          <button type="button" id="openSidebar">☰ Topics</button>
          <button type="button" id="openToc">☷ Contents</button>
        </div>

        <div class="content-toolbar">
          <div class="breadcrumbs" id="breadcrumbs">Help Centre</div>
          <input class="article-search" id="articleSearch" type="search"
                 placeholder="Search this page..." aria-label="Search within this page">
        </div>

        <h1 class="article-title" id="articleTitle">Help Centre</h1>
        <p class="article-meta" id="articleMeta">Select a topic from the left menu.</p>

        <article class="article-content" id="articleContent" aria-live="polite">
          <div class="status">Loading documentation...</div>
        </article>

        <nav class="bottom-nav" aria-label="Topic navigation">
          <div class="nav-card previous">
            <span class="nav-caption">Previous</span>
            <button class="prev-next" id="previousTopic" type="button" disabled>
              <span aria-hidden="true">←</span><span id="previousTitle">Previous topic</span>
            </button>
          </div>
          <div class="nav-card next">
            <span class="nav-caption">Up next</span>
            <button class="prev-next" id="nextTopic" type="button" disabled>
              <span id="nextTitle">Next topic</span><span aria-hidden="true">→</span>
            </button>
          </div>
        </nav>
      </div>
    </main>

    <aside class="right-sidebar" id="rightSidebar" aria-label="Table of contents">
      <div class="toc-sticky">
        <h2 class="toc-title">Table of contents</h2>
        <ol class="toc-list" id="tocList">
          <li class="toc-empty">Headings will appear here.</li>
        </ol>
      </div>
    </aside>
  </div>

  <div class="scrim" id="scrim"></div>

  <script>
    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const HELP_CONFIG = {
      // Paste your deployed Google Apps Script /exec URL here.
      API_URL: "https://script.google.com/macros/s/AKfycbxduhlcnVmVzLs-ggcIUUjaHGXZlVXI-kxRp5DJr_i7JczNzR2cOfsANehVklTrF5yHRQ/exec",

      // Relative to this index.html. Example: help/my-file.html
      HELP_DIRECTORY: "help/",

      // Keep this true if the HTML documents are trusted files
      // maintained by your own help portal administrators.
      ALLOW_TRUSTED_HTML: true
    };

    let allTopics = [];
    let currentTopicId = null;
    let currentTopicData = null;
    let currentHeadings = [];
    let currentObjectUrl = null;

    const $ = (selector) => document.querySelector(selector);

    /* =========================================================
       JSONP API CLIENT
       ========================================================= */

    function apiRequest(params = {}) {
      return new Promise((resolve, reject) => {
        if (!HELP_CONFIG.API_URL ||
            HELP_CONFIG.API_URL.includes("YOUR_GOOGLE")) {
          reject(new Error("Please configure HELP_CONFIG.API_URL in index.html."));
          return;
        }

        const callbackName = "__help_cb_" +
          Date.now() + "_" + Math.random().toString(36).slice(2);

        const script = document.createElement("script");
        let settled = false;

        const cleanup = () => {
          delete window[callbackName];
          script.remove();
          clearTimeout(timeout);
        };

        const timeout = setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("The Help API did not respond. Please try again."));
        }, 20000);

        window[callbackName] = (data) => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(data);
        };

        const query = new URLSearchParams({
          ...params,
          callback: callbackName
        });

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("Unable to connect to the Help API."));
        };

        script.src = HELP_CONFIG.API_URL + "?" + query.toString();
        document.head.appendChild(script);
      });
    }

    /* =========================================================
       INITIALIZATION
       ========================================================= */

    document.addEventListener("DOMContentLoaded", initialize);

    async function initialize() {
      bindInterfaceEvents();

      try {
        const response = await apiRequest({ action: "topics" });

        if (!response.success) {
          throw new Error(response.message || "Unable to load topics.");
        }

        allTopics = Array.isArray(response.topics) ? response.topics : [];

        if (!allTopics.length) {
          $("#sidebarNavigation").innerHTML =
            '<div class="empty-search">No published help topics found.</div>';
          $("#articleContent").innerHTML =
            '<div class="status">No help documents have been published yet.</div>';
          return;
        }

        renderSidebar();

        const requestedId = new URLSearchParams(location.search).get("topic");
        const firstTopic = allTopics[0];
        const initialTopic = allTopics.find(t => t.topicId === requestedId) || firstTopic;

        await openTopic(initialTopic.topicId, false);

      } catch (error) {
        showError(error.message);
      }
    }

    /* =========================================================
       SIDEBAR: MAIN MENU > SUBMENU > TOPICS
       ========================================================= */

    function groupTopics(topics) {
      const mainGroups = new Map();

      topics.forEach(topic => {
        const mainName = topic.mainMenu || "General";
        if (!mainGroups.has(mainName)) {
          mainGroups.set(mainName, {
            name: mainName,
            order: Number(topic.mainOrder) || 0,
            submenus: new Map()
          });
        }

        const main = mainGroups.get(mainName);
        const subName = topic.subMenu || "";

        if (!main.submenus.has(subName)) {
          main.submenus.set(subName, {
            name: subName,
            order: Number(topic.subOrder) || 0,
            topics: []
          });
        }

        main.submenus.get(subName).topics.push(topic);
      });

      return [...mainGroups.values()]
        .sort((a, b) => a.order - b.order)
        .map(main => ({
          ...main,
          submenus: [...main.submenus.values()]
            .sort((a, b) => a.order - b.order)
        }));
    }

    function renderSidebar(filterText = "") {
      const nav = $("#sidebarNavigation");
      const normalized = filterText.trim().toLowerCase();
      const groups = groupTopics(allTopics);
      let html = "";
      let visibleCount = 0;

      groups.forEach((main, mainIndex) => {
        const matchingSubmenus = [];

        main.submenus.forEach(sub => {
          const matchingTopics = sub.topics.filter(topic => {
            const searchable = [
              topic.mainMenu, topic.subMenu, topic.topicTitle, topic.topicId
            ].join(" ").toLowerCase();
            return !normalized || searchable.includes(normalized);
          });

          if (matchingTopics.length) {
            matchingSubmenus.push({ ...sub, topics: matchingTopics });
            visibleCount += matchingTopics.length;
          }
        });

        if (!matchingSubmenus.length) return;

        const isCurrentGroup = matchingSubmenus.some(sub =>
          sub.topics.some(t => t.topicId === currentTopicId)
        );
        const expanded = normalized || isCurrentGroup || mainIndex === 0;

        html += `
          <div class="main-nav-item">
            <button class="main-nav-button" type="button"
              data-main-index="${mainIndex}" aria-expanded="${!!expanded}">
              <span>${escapeHtml(main.name)}</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <div class="subnav" ${expanded ? "" : "hidden"}>
        `;

        matchingSubmenus.forEach(sub => {
          if (sub.name) {
            html += `<div class="subnav-group">
              <div class="subnav-label">${escapeHtml(sub.name)}</div>`;
          }

          sub.topics.forEach(topic => {
            const active = topic.topicId === currentTopicId;
            html += `
              <button type="button"
                class="topic-button ${active ? "active" : ""}"
                data-topic-id="${escapeAttribute(topic.topicId)}"
                ${active ? 'aria-current="page"' : ""}>
                ${escapeHtml(topic.topicTitle)}
              </button>
            `;
          });

          if (sub.name) html += `</div>`;
        });

        html += `</div></div>`;
      });

      nav.innerHTML = html || '<div class="empty-search">No matching topics found.</div>';

      nav.querySelectorAll(".main-nav-button").forEach(button => {
        button.addEventListener("click", () => {
          const panel = button.nextElementSibling;
          const willOpen = panel.hidden;
          panel.hidden = !willOpen;
          button.setAttribute("aria-expanded", String(willOpen));
        });
      });

      nav.querySelectorAll("[data-topic-id]").forEach(button => {
        button.addEventListener("click", () => {
          openTopic(button.dataset.topicId);
          closeMobilePanels();
        });
      });
    }

    /* =========================================================
       OPEN TOPIC
       ========================================================= */

    async function openTopic(topicId, updateUrl = true) {
      const topic = allTopics.find(t => t.topicId === topicId);
      if (!topic) return;

      currentTopicId = topicId;
      currentTopicData = topic;

      renderSidebar($("#topicSearch").value);

      $("#articleTitle").textContent = topic.topicTitle;
      $("#articleMeta").textContent = "Loading document...";
      $("#breadcrumbs").innerHTML =
        `${escapeHtml(topic.mainMenu || "Help Centre")}` +
        (topic.subMenu ? ` <span>›</span> ${escapeHtml(topic.subMenu)}` : "") +
        ` <span>›</span> <strong>${escapeHtml(topic.topicTitle)}</strong>`;

      $("#articleContent").innerHTML =
        '<div class="status">Loading document...</div>';
      $("#tocList").innerHTML = '<li class="toc-empty">Loading contents...</li>';

      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set("topic", topicId);
        history.pushState({ topicId }, "", url);
      }

      try {
        const response = await apiRequest({
          action: "topic",
          id: topicId
        });

        if (!response.success) {
          throw new Error(response.message || "Topic could not be loaded.");
        }

        // Ignore an older request if the user selected another topic meanwhile.
        if (currentTopicId !== topicId) return;

        renderPreviousNext(response.previous, response.next);

        const contentUrl = resolveContentUrl(
          response.topic && response.topic.contentPath
            ? response.topic.contentPath
            : topic.contentPath
        );

        await renderDocument(contentUrl, topic.contentType);

        if (currentTopicId !== topicId) return;

        $("#articleMeta").textContent =
          topic.mainMenu + (topic.subMenu ? "  /  " + topic.subMenu : "");

        buildTableOfContents();
        $("#articleContent").scrollTop = 0;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (error) {
        if (currentTopicId !== topicId) return;
        $("#articleMeta").textContent = "Document unavailable";
        $("#articleContent").innerHTML =
          `<div class="status error">${escapeHtml(error.message)}</div>`;
        $("#tocList").innerHTML = '<li class="toc-empty">No headings available.</li>';
      }
    }

    function resolveContentUrl(contentPath) {
      if (!contentPath) throw new Error("No document filename is configured.");

      // Prevent a sheet entry from navigating outside the website's help folder.
      const cleanPath = String(contentPath).replace(/^\/+/, "");
      if (cleanPath.split("/").includes("..")) {
        throw new Error("Invalid document path.");
      }

      return new URL(cleanPath, document.baseURI).href;
    }

    /* =========================================================
       DOCUMENT RENDERERS
       ========================================================= */

    async function renderDocument(url, type) {
      const container = $("#articleContent");
      const extension = String(type || url.split("?")[0].split(".").pop()).toUpperCase();

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      if (extension === "PDF") {
        container.innerHTML = "";
        const iframe = document.createElement("iframe");
        iframe.className = "pdf-frame";
        iframe.title = "Help document PDF";
        iframe.src = url;
        container.appendChild(iframe);
        $("#articleMeta").textContent = "PDF document";
        return;
      }

      if (extension === "DOCX") {
        await renderDocx(url, container);
        $("#articleMeta").textContent = "Word document";
        return;
      }

      await renderHtmlDocument(url, container);
      $("#articleMeta").textContent = "HTML document";
    }

    async function renderHtmlDocument(url, container) {
      const response = await fetch(url, { cache: "no-cache" });
      if (!response.ok) {
        throw new Error(`Unable to load HTML document (${response.status}).`);
      }

      const source = await response.text();
      const parsed = new DOMParser().parseFromString(source, "text/html");

      // Remove active content and unsafe embedded elements.
      parsed.querySelectorAll("script, iframe, object, embed, form, base").forEach(el => el.remove());

      const root = parsed.body || parsed.documentElement;

      root.querySelectorAll("*").forEach(el => {
        [...el.attributes].forEach(attr => {
          const name = attr.name.toLowerCase();
          const value = attr.value.trim();

          if (name.startsWith("on")) {
            el.removeAttribute(attr.name);
          } else if (
            ["href", "src", "action", "formaction", "xlink:href"].includes(name) &&
            /^\s*javascript:/i.test(value)
          ) {
            el.removeAttribute(attr.name);
          } else if (["src", "href"].includes(name) && value &&
                     !value.startsWith("#") && !/^(data:|blob:|https?:|mailto:|tel:)/i.test(value)) {
            try {
              el.setAttribute(attr.name, new URL(value, url).href);
            } catch (_) {
              el.removeAttribute(attr.name);
            }
          }
        });
      });

      // Keep the article's body content. Prefer content inside <main> or <article>
      // if the source file is a complete webpage with its own site navigation.
      const articleRoot = root.querySelector("article, main") || root;
      const fragment = document.createDocumentFragment();

      [...articleRoot.childNodes].forEach(node => {
        fragment.appendChild(document.importNode(node, true));
      });

      container.replaceChildren(fragment);

      if (!container.childNodes.length) {
        container.innerHTML = '<p>This help document is empty.</p>';
      }
    }

    async function renderDocx(url, container) {
      if (!window.docx || typeof window.docx.renderAsync !== "function") {
        throw new Error("DOCX preview library did not load. Check your internet connection.");
      }

      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Unable to load DOCX document (${response.status}).`);
      }

      const blob = await response.blob();
      container.innerHTML = '<div class="docx-container" id="docxPreview"></div>';

      await window.docx.renderAsync(
        blob,
        $("#docxPreview"),
        null,
        {
          className: "docx",
          inWrapper: true,
          ignoreWidth: false,
          ignoreHeight: false,
          ignoreFonts: false,
          breakPages: true
        }
      );
    }

    /* =========================================================
       TABLE OF CONTENTS: H1 + H2 IN DOCUMENT ORDER
       ========================================================= */

    function buildTableOfContents() {
      const article = $("#articleContent");
      const headings = [...article.querySelectorAll("h1, h2")];
      const toc = $("#tocList");

      currentHeadings = headings.map((heading, index) => {
        if (!heading.id) {
          heading.id = "help-heading-" + index + "-" +
            heading.textContent.trim().toLowerCase()
              .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        }

        return {
          id: heading.id,
          text: heading.textContent.trim(),
          level: heading.tagName.toLowerCase()
        };
      }).filter(item => item.text);

      if (!currentHeadings.length) {
        toc.innerHTML = '<li class="toc-empty">No H1 or H2 headings in this document.</li>';
        return;
      }

      toc.innerHTML = currentHeadings.map(item => `
        <li class="${item.level === "h2" ? "level-2" : "level-1"}">
          <a href="#${escapeAttribute(item.id)}"
             data-heading-id="${escapeAttribute(item.id)}">
            ${escapeHtml(item.text)}
          </a>
        </li>
      `).join("");

      toc.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          const target = document.getElementById(link.dataset.headingId);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            history.replaceState(history.state, "", "#" + encodeURIComponent(target.id));
          }
          closeMobilePanels();
        });
      });
    }

    /* =========================================================
       PREVIOUS / NEXT TOPIC
       ========================================================= */

    function renderPreviousNext(previous, next) {
      const prevButton = $("#previousTopic");
      const nextButton = $("#nextTopic");

      prevButton.disabled = !previous;
      nextButton.disabled = !next;

      $("#previousTitle").textContent =
        previous ? previous.topicTitle : "Previous topic";

      $("#nextTitle").textContent =
        next ? next.topicTitle : "Next topic";

      prevButton.onclick = previous
        ? () => openTopic(previous.topicId)
        : null;

      nextButton.onclick = next
        ? () => openTopic(next.topicId)
        : null;
    }

    /* =========================================================
       SEARCH AND INTERFACE EVENTS
       ========================================================= */

    function bindInterfaceEvents() {
      $("#topicSearch").addEventListener("input", event => {
        renderSidebar(event.target.value);
      });

      $("#articleSearch").addEventListener("input", event => {
        const term = event.target.value.trim();
        const article = $("#articleContent");

        // Clear previous marks before applying a new search.
        article.querySelectorAll("mark.help-search-mark").forEach(mark => {
          mark.replaceWith(document.createTextNode(mark.textContent));
        });

        if (!term) return;

        const walker = document.createTreeWalker(
          article, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
              if (!node.nodeValue.trim() ||
                  node.parentElement.closest("script, style, mark, iframe, pre, code")) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            }
          }
        );

        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(escaped, "gi");

        nodes.forEach(node => {
          if (!regex.test(node.nodeValue)) return;
          regex.lastIndex = 0;

          const fragment = document.createDocumentFragment();
          let lastIndex = 0;
          node.nodeValue.replace(regex, (match, offset) => {
            fragment.appendChild(document.createTextNode(node.nodeValue.slice(lastIndex, offset)));
            const mark = document.createElement("mark");
            mark.className = "help-search-mark";
            mark.textContent = match;
            fragment.appendChild(mark);
            lastIndex = offset + match.length;
            return match;
          });
          fragment.appendChild(document.createTextNode(node.nodeValue.slice(lastIndex)));
          node.parentNode.replaceChild(fragment, node);
        });

        const firstMatch = article.querySelector("mark.help-search-mark");
        if (firstMatch) firstMatch.scrollIntoView({ behavior: "smooth", block: "center" });
      });

      $("#openSidebar").addEventListener("click", () => {
        document.body.classList.remove("show-toc");
        document.body.classList.toggle("show-left");
      });

      $("#openToc").addEventListener("click", () => {
        document.body.classList.remove("show-left");
        document.body.classList.toggle("show-toc");
      });

      $("#scrim").addEventListener("click", closeMobilePanels);

      window.addEventListener("popstate", async () => {
        const id = new URLSearchParams(location.search).get("topic");
        if (id && allTopics.some(t => t.topicId === id)) {
          await openTopic(id, false);
        }
      });

      $("#resourcesLink").addEventListener("click", event => event.preventDefault());
      $("#getStartedLink").addEventListener("click", event => event.preventDefault());
    }

    function closeMobilePanels() {
      document.body.classList.remove("show-left", "show-toc");
    }

    /* =========================================================
       UTILITIES
       ========================================================= */

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function showError(message) {
      $("#sidebarNavigation").innerHTML =
        `<div class="status error">${escapeHtml(message)}</div>`;
      $("#articleContent").innerHTML =
        `<div class="status error">${escapeHtml(message)}</div>`;
      $("#articleTitle").textContent = "Unable to load Help Centre";
      $("#articleMeta").textContent = "Please check your API configuration.";
    }
  </script>
</body>
</html>
